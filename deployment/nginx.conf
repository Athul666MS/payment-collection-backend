server {
    listen 80;
    server_name your_ec2_public_ip_or_domain; # REPLACE THIS

    # Serve the React Native Web App (optional if you deploy the frontend here too)
    # location / {
    #     root /var/www/payment-collection/frontend/dist;
    #     index index.html;
    #     try_files $uri $uri/ /index.html;
    # }

    # Reverse proxy for the Node.js Backend API
    location /api/ {
        proxy_pass http://localhost:5000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Real IP headers
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
